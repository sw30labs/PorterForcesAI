[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "porter-forces-ai"
version = "0.1.0"
description = "Evidence-led Porter Five Forces and board decision support for financial services"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PorterForcesAI contributors" }]
dependencies = [
  "ddgs>=9.15.0,<10",
  "deepagents>=0.7.8,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=1.6.0,<2",
  "langgraph>=1.2.11,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "typer>=0.19,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
porter-forces = "porter_forces_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/porter_forces_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
