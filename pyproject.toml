[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "porter-forces-ai"
version = "0.1.0-beta"
description = "Evidence-led Porter Five Forces and board decision support for financial services"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{ name = "PorterForcesAI contributors" }]
dependencies = [
  "ddgs==9.15.0",
  "deepagents==0.7.14",
  "fastapi==0.141.1",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "typer==0.27.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.4",
]

[project.scripts]
porter-forces = "porter_forces_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/porter_forces_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
